<title>Jotly · 心迹智析</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&amp;family=Figtree:wght@400;600&amp;display=swap">
<style>
:root{--bg:#edf2ef;--card:#fbfdfc;--ink:#16231f;--mut:#5d716b;--pri:#1f4d47;--onpri:#fff;--lamp:#f2a93b;--soft:#dbe7e2;--line:#c9d9d3;--ok:#3f8a6b;--warn:#b57a10;--bad:#c8553d;--serif:"Newsreader","Noto Serif SC",Georgia,serif;--sans:"Figtree",system-ui,"PingFang SC","Microsoft YaHei",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0f1a17;--card:#17261f;--ink:#e6f0ec;--mut:#9bb0a9;--pri:#7fcdbd;--onpri:#0f1a17;--soft:#1f342d;--line:#2b443b;--ok:#6cc9a0;--warn:#e0a63c;--bad:#ee8a72}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
nav{width:216px;padding:28px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;background:var(--pri);color:var(--onpri)}
nav h1{font:600 28px var(--serif);margin:0 0 2px}
nav small{opacity:.75;margin-bottom:22px}
nav button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer;opacity:.8}
nav button.on{background:rgba(255,255,255,.16);opacity:1;font-weight:600}
.streak{margin-top:auto;background:var(--lamp);color:#3a2705;border-radius:12px;padding:10px 12px;font-weight:600}
main{flex:1;max-width:760px;padding:40px 32px 80px;margin:0 auto;width:100%}
h2{font:400 36px/1.15 var(--serif);margin:0 0 6px}
.sub{color:var(--mut);margin:0 0 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.banner{background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:20px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:99px;padding:10px 22px;cursor:pointer;font-weight:600}
.btn.alt{background:none;color:var(--pri);border:1px solid var(--pri)}
.btn:disabled{opacity:.5;cursor:wait}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px}
.moods{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.moods button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;font-size:14px;min-width:64px}
.moods button span{display:block;font-size:24px;line-height:1.2}
.moods button.on{border-color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.moods button.mood-new{background:none;border-style:dashed;color:var(--mut);font-weight:600}
.mform{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.mform input[type=text]{width:auto;flex:0 0 auto}
.mform .memo{width:76px!important;text-align:center;font-size:20px;padding:8px 6px}
.mform .mlab{flex:1 1 140px;width:auto!important;min-width:120px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
input[type=date],input[type=text],input[type=password],select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
input[type=date]{width:auto}
textarea{width:100%;min-height:240px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:20px 22px;background:var(--card);font:20px/1.7 var(--serif);background-image:repeating-linear-gradient(transparent 0 33px,var(--line) 33px 34px);background-attachment:local}
textarea.sm{min-height:80px;font:17px/1.5 var(--serif);background-image:none;padding:12px 14px}
.entry{font:19px/1.7 var(--serif);white-space:pre-wrap}
.bub{padding:12px 16px;border-radius:16px;margin:10px 0;max-width:88%;white-space:pre-wrap}
.bub.ai{background:var(--soft);border-bottom-left-radius:4px}
.bub.me{background:var(--pri);color:var(--onpri);margin-left:auto;border-bottom-right-radius:4px}
.chip{display:inline-block;border-radius:99px;padding:2px 10px;font-size:13px;font-weight:600;background:var(--soft)}
.muted{color:var(--mut);font-size:14px}
.chart{display:flex;gap:10px;align-items:flex-end;height:150px;margin:8px 0 4px}
.chart div{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.chart i{display:block;border-radius:8px 8px 3px 3px;min-height:4px;background:var(--line)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stats b{font:600 30px var(--serif);display:block}
.help{border-left:5px solid var(--bad)}
.stage{position:relative;width:min(300px,80vw);height:300px;margin:20px auto;display:grid;place-items:center}
.orb{position:absolute;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--lamp),var(--pri));opacity:.85}
.ptxt{position:relative;text-align:center;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.5);font:600 20px var(--serif)}
.ptxt b{display:block;font-size:38px}
.relgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.relcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.relcard:hover{border-color:var(--pri)}
.relcard .ri{font-size:30px;line-height:1.1}
.relcard b{font:600 18px var(--serif)}
.relcard small{color:var(--mut);font-size:13px;line-height:1.45}
.gstep{border-top:1px solid var(--line);padding:12px 0 4px}
.gstep:first-of-type{border-top:0}
.gstep.gwait{opacity:.45}
.gstep.gd .glab b{text-decoration:line-through;opacity:.7}
.glab{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:15px;margin-bottom:8px}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dot{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:0}
.dot.on{background:var(--pri);border-color:var(--pri)}
.dot:disabled{cursor:not-allowed}
.rnote{background:var(--soft);border-radius:10px;padding:12px 14px;margin:16px 0 4px;font-weight:600}
.ntask{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer;font-size:15px;line-height:1.45}
.ntask.on{background:var(--soft);border-color:var(--pri)}
.ntask .nbox{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--onpri);margin-top:1px}
.ntask.on .nbox{background:var(--pri);border-color:var(--pri)}
/* fortune */
.ftag{letter-spacing:3px;font-size:11px;font-weight:700;color:var(--mut);text-align:center;margin-bottom:8px;text-transform:uppercase}
.ftrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:8px 0 4px}
.fslot{text-align:center}
.fpos{display:block;font-size:12px;font-weight:700;color:var(--mut);letter-spacing:2px;margin-bottom:8px}
.fcard{width:104px;height:164px;perspective:800px;cursor:pointer}
.finner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s}
.fcard.flip .finner{transform:rotateY(180deg);animation:fflip .6s ease}
@keyframes fflip{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.fface{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center}
.fback{background:repeating-linear-gradient(45deg,#23604f 0 9px,#1b4a3d 9px 18px);border:2px solid var(--lamp);color:var(--lamp);font-size:26px}
.ffront{background:var(--card);border:2px solid var(--pri);transform:rotateY(180deg);color:var(--ink)}
.ffront .fem{font-size:26px}
.ffront h4{margin:6px 0 2px;font-size:13px;font-weight:600}
.ffront small{font-size:10px;color:var(--mut);letter-spacing:1px}
.freading{background:var(--soft);border-radius:12px;padding:14px;margin-top:14px}
.freading .rt{color:var(--warn);font-weight:700;text-align:center;margin-bottom:8px;font-size:14px}
.freading p{font-size:14px;margin:0 0 8px}
.fqian{text-align:center}
.fqian .ftube{background:none;border:0;font-size:46px;cursor:pointer;animation:ftube .55s ease;line-height:1}
@keyframes ftube{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}55%{transform:rotate(10deg)}80%{transform:rotate(-6deg)}}
.fqres{margin-top:14px}
.fno{font-size:24px;font-weight:700;color:var(--warn)}
.fgrade{display:inline-block;background:rgba(242,169,59,.16);border:1px solid var(--lamp);color:var(--warn);border-radius:16px;padding:2px 16px;font-size:13px;font-weight:700;margin:4px 0 8px}
.fpoem{font:18px/1.6 var(--serif);letter-spacing:1px;margin:6px 0;color:var(--ink)}
.fexp{font-size:14px;color:var(--mut);max-width:540px;margin:8px auto 0;text-align:left}
.fpaper{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:18px;margin-top:16px;animation:funroll .5s ease}
@keyframes funroll{from{transform:scaleY(.2);opacity:0}to{transform:scaleY(1);opacity:1}}
.fograde{font-size:26px;font-weight:800;letter-spacing:6px;text-align:center;color:var(--bad);margin-bottom:10px}
.fline{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding:8px 0;font-size:14px;text-align:left}
.fline b{white-space:nowrap;color:var(--bad);font-weight:600}
.fgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.fz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;cursor:pointer;text-align:center}
.fz span{display:block;font-size:22px;line-height:1.2}
.fz small{font-size:11px;color:var(--mut)}
.fz.on{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.fzres{background:var(--soft);border-radius:12px;padding:16px;margin-top:16px;text-align:center}
.fzname{font-weight:700;color:var(--pri)}
.fbar{height:8px;border-radius:6px;background:var(--line);max-width:320px;margin:10px auto 0;overflow:hidden}
.fbar i{display:block;height:100%;background:var(--pri);border-radius:6px;transition:width .8s ease}
.fich{background:linear-gradient(160deg,#2b2f26,#232820);border-color:#3a4032;color:#e8e2cf}
.fich .btn{background:linear-gradient(90deg,#d9a441,#f5c96b);color:#4a3208}
.fich .muted{color:#b9bdac}
.fcoin{display:inline-block;width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d9a8,#b8863b);color:#6b4a12;font-weight:800;line-height:38px;margin:0 5px;font-size:13px;opacity:0}
.fcoin.show{animation:fcoin .45s ease forwards}
@keyframes fcoin{from{transform:rotateY(90deg) scale(.4);opacity:0}to{transform:none;opacity:1}}
.flines{max-width:280px;margin:14px auto;min-height:6px}
.fgline{display:flex;align-items:center;margin:8px 0;opacity:0;animation:fcoin .4s ease forwards}
.fbar2{flex:1;height:9px;background:#e8c87a;border-radius:4px;position:relative}
.fbar2.yin::after{content:"";position:absolute;left:38%;right:38%;top:-2px;bottom:-2px;background:#272b22}
.fgname{font-size:20px;font-weight:800;color:#f5c96b}
.fgexp{color:#cfc39a;font-size:14px;max-width:520px;margin:8px auto 0}
.mname{text-align:center;font:600 24px var(--serif);margin:18px 0 6px}
.mtimer{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:12px;min-height:32px}
.mtimer b{font:600 28px var(--serif);color:var(--pri)}
.mprog{display:flex;gap:8px;justify-content:center;margin:6px 0 16px}
.mdt{width:34px;height:6px;border-radius:99px;background:var(--line)}
.mdt.on{background:var(--pri)}
.moods .mwrap{position:relative;display:inline-flex}
.moods button.mdel{position:absolute;top:-7px;right:-7px;min-width:0;width:19px;height:19px;padding:0;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--mut);font-size:12px;line-height:1;display:grid;place-items:center;opacity:.85}
.moods button.mdel:hover{color:var(--bad);border-color:var(--bad);opacity:1}
ul{padding-left:20px;margin:6px 0}
.fld{display:block;margin:12px 0 0}
.fld>span{display:block;font-size:14px;color:var(--mut);margin-bottom:6px}
.lockbox{text-align:center;padding:28px 22px}
.lockbox .lbig{font-size:52px;line-height:1.1;margin-bottom:8px}
.lockbox .fld,.lockbox p{text-align:left;max-width:380px;margin-left:auto;margin-right:auto}
.errline{color:var(--bad);font-weight:600;font-size:14px;margin:10px auto 0!important}
.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.gone{display:none}
.vitem{border-left:4px solid var(--pri)}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:var(--pri);color:var(--onpri);padding:10px 20px;border-radius:99px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:86vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.hrow{display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.hrow .txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:720px){.app{flex-direction:column}nav{width:100%;height:auto;position:sticky;top:0;z-index:5;flex-direction:row;flex-wrap:wrap;padding:10px;gap:2px;align-items:center}nav h1{font-size:20px;margin:0 8px 0 4px}nav small{display:none}nav button{padding:7px 9px;font-size:14px}.streak{margin:0 0 0 auto;padding:4px 10px}main{padding:24px 16px 60px}h2{font-size:30px}.stats{grid-template-columns:1fr}.relgrid{grid-template-columns:1fr}.fgrid{grid-template-columns:repeat(4,1fr)}.fcard{width:88px;height:142px}}
@media(prefers-reduced-motion:reduce){.orb,.toast{transition:none!important}.shake{animation:none!important}}
</style></head><body>

async function createVault(){
  if(!canCrypt()){vErr='vnosub';return render()}
  const p=$('#vpw').value,p2=$('#vpw2').value;
  if(p.length<4){vErr='vshort';return render()}
  if(p!==p2){vErr='vmismatch';return render()}
  vSalt=b64(rnd(16));vKey=await dk(p,unb64(vSalt));vEntries=[];vMoods=[];
  await persistVault();vErr='';armLock();render();
}
async function unlockVault(){
  const m=vMeta(),pw=$('#vpw').value;if(!m||!pw)return;
  try{
    const key=await dk(pw,unb64(m.salt));
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.iv)},key,unb64(m.ct));
    const d=JSON.parse(dec.decode(pt));
    vEntries=Array.isArray(d)?d:(d.es||[]);
    vMoods=Array.isArray(d)?[]:(d.ms||[]);
    vKey=key;vSalt=m.salt;vErr='';armLock();render();
  }catch(e){vErr='vwrong';render()}
}
async function changeVaultPw(){
  const cur=$('#vcur').value,nw=$('#vnew').value,m=vMeta();
  if(nw.length<4){vErr='vshort';return render()}
  try{
    const old=await dk(cur,unb64(m.salt));
    await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(m.iv)},old,unb64(m.ct));
  }catch(e){vErr='vwrong';return render()}
  vSalt=b64(rnd(16));vKey=await dk(nw,unb64(vSalt));
  await persistVault();vErr='';render();toast(t('vpwok'));
}

/* ---------- AI ---------- */
async function ai(prompt){
  const key=S.userKey||API_KEY;
  if(!key)throw new Error('quota');
  const models=[MODEL,...FALL].filter((m,i,a)=>m&&a.indexOf(m)===i);let err,quota=false;
  for(const m of models){
    try{
      const r=await fetch(URL_,{method:'POST',headers:{'Authorization':'Bearer '+key,'Content-Type':'application/json','X-Title':'Jotly'},body:JSON.stringify({model:m,messages:prompt,temperature:0.6})});
      const d=await r.json().catch(()=>({}));
      if(!r.ok){const x=new Error(d.error&&d.error.message||('HTTP '+r.status));x.q=[401,402,429].includes(r.status)||/rate.?limit|quota|credit|per.?day/i.test(x.message);throw x}
      const c=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;
      if(!c)throw new Error('Empty reply');
      return c;
    }catch(e){err=e;if(e.q)quota=true}
  }
  if(quota)throw new Error('quota');
  throw err;
}
function pj(s){const a=s.indexOf('{'),b=s.lastIndexOf('}');try{return JSON.parse(s.slice(a,b+1))}catch(e){return null}}
const num=v=>{const n=parseFloat(v);return isFinite(n)?Math.max(0,Math.min(10,Math.round(n))):null};
const findStress=r=>{const m=r.match(/stress[^0-9\n]{0,20}(\d+(?:\.\d+)?)/i)||r.match(/(\d+(?:\.\d+)?)\s*\/\s*10/);return m?num(m[1]):null};
const hasZh=s=>/[\u4e00-\u9fff]/.test(s||'');
const isZh=txt=>S.lang==='zh'||hasZh(txt);
const cl=r=>r.replace(/<think>[\s\S]*?<\/think>/g,'').replace(/```(?:json)?/g,'');
const mine=e=>e.text+' '+e.thread.filter(x=>x.r==='me').map(x=>x.t).join(' ');
const ZHFIX='请只用简体中文重新回答：所有文字内容（emotion、remark、message 等）都必须是中文，保持相同的 JSON 格式，只输出 JSON。';

function build(e){
  const closing=e.thread.filter(x=>x.r==='me').length>=3,zh=isZh(mine(e)),fv=favs();
  const lang=zh?'LANGUAGE RULE (critical): write the emotion, remark, message and suggestion values ONLY in Simplified Chinese (简体中文), even though these instructions are in English. 所有文字内容必须使用简体中文。Keep the JSON keys and the method id in English.':'LANGUAGE RULE: write in English.';
  const ex=zh?'{"stress":7,"emotion":"不堪重负","remark":"你的压力大约是 7/10，主要来自堆积的截止日期。","message":"听起来真的很累。今天哪一部分最消耗你？","method":"music","suggestion":"戴上耳机，听十分钟舒缓的音乐，让紧绷的肩膀放松下来。"}':'{"stress":7,"emotion":"overwhelmed","remark":"Your stress is around 7/10, mainly from the deadline pile-up.","message":"That sounds heavy. What part of the day drained you most?","method":"music","suggestion":"Put on a calming playlist for ten minutes and let your shoulders drop."}';
  const sys='You are Jotly, a warm journaling companion for people facing burnout.\n'+lang+'\nRead the diary and the conversation so far, then reply with ONE JSON object and nothing else (no markdown, no code fences). Format example:\n'+ex+'\nAll seven fields are REQUIRED in every reply:\n- stress: an integer from 0 (calm) to 10 (severe burnout), judged from the whole diary and conversation. Never omit it; never use words or ranges.\n- emotion: one or two words.\n- remark: one sentence telling the user their stress level and the main reason for it.\n- message: 1-3 sentences of brief empathy'+(closing?', then a warm wrap-up with NO question.':', then ONE gentle open follow-up question.')+'\n- method: if stress is 6 or higher, exactly ONE id from the user\'s preferred de-stress list ['+fv.join(', ')+'] that best fits their situation (if the diary shows that activity is part of the stress, pick another id from the list); otherwise an empty string. Ids: meditation = a guided breathing exercise in this app, music = Spotify, social = TikTok, friends = chatting with friends on WeChat, exercise = a short movement routine in this app, nature = a short outdoor break.\n- suggestion: if method is set, one short, kind, specific sentence recommending that activity; otherwise an empty string.\nYou are not a therapist and never diagnose. If the user mentions self-harm or hopelessness, kindly urge them to reach out to someone they trust or a helpline.\n'+lang;
  const msgs=[{role:'user',content:sys+'\n\nDate: '+e.date+'\nMood: '+moodInfo(e.mood,'en').l+'\nDiary: '+e.text}];
  e.thread.forEach(x=>msgs.push({role:x.r==='ai'?'assistant':'user',content:x.t}));
  return msgs;
}
async function turn(e){
  busy=true;e.err='';render();
  try{
    const msgs=build(e),zh=isZh(mine(e));
    let clean=cl(await ai(msgs)),j=pj(clean)||{};
    if(zh&&!hasZh(String(j.message||'')+String(j.remark||''))){
      try{const c2=cl(await ai([...msgs,{role:'assistant',content:clean},{role:'user',content:ZHFIX}])),j2=pj(c2);if(j2&&hasZh(String(j2.message||'')+String(j2.remark||''))){clean=c2;j=j2}}catch(_){}
    }
    let st=num(j.stress);if(st==null)st=findStress(clean);
    if(st==null){try{const q=await ai([{role:'user',content:'Rate the stress and burnout level in this diary from 0 (calm) to 10 (severe). Reply with ONLY one integer.\n\n'+mine(e)}]);st=num((q.match(/\d+(?:\.\d+)?/)||[])[0])}catch(_){}}
    if(st==null)st=e.stress!=null?e.stress:moodStress(e.mood);
    e.stress=st;
    if(j.emotion)e.emotion=String(j.emotion);
    e.remark=j.remark?String(j.remark):(zh?'估计压力水平：'+st+'/10。':'Estimated stress level: '+st+'/10.');
    e.thread.push({r:'ai',t:String(j.message||clean.replace(/\{[\s\S]*\}/,'').trim()||clean.trim())});
    e.method='';e.sug='';
    if(st>=6){const f=favs();let m=String(j.method||'').trim().toLowerCase();if(!f.includes(m))m=f[Math.floor(Math.random()*f.length)];e.method=m;e.sug=j.suggestion?String(j.suggestion):DEF[m][zh?1:0]}
  }catch(x){e.err=x.message==='quota'?'quota':x.message}
  busy=false;save();render();
}

function weekData(){
  const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push(iso(d))}
  const per=days.map(d=>{const es=S.entries.filter(e=>e.date===d);const ss=es.filter(e=>e.stress!=null).map(e=>e.stress);return{d,es,avg:ss.length?ss.reduce((a,b)=>a+b,0)/ss.length:null,mood:es.length?es[es.length-1].mood:null}});
  const all=per.flatMap(p=>p.es);const sv=all.filter(e=>e.stress!=null).map(e=>e.stress);
  const avg=sv.length?sv.reduce((a,b)=>a+b,0)/sv.length:null;
  const hi=sv.filter(s=>s>=7).length;
  const risk=avg==null?null:(avg>=7||hi>=3)?'high':avg>=5?'moderate':'low';
  return{per,all,avg,risk,n:per.filter(p=>p.es.length).length};
}

  return h;

function sndStart(kind){
  killAudio();
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC){toast(t('rNoAudio'));return}
  let ac;
  try{ac=new AC()}catch(e){toast(t('rNoAudio'));return}
  const len=Math.floor(ac.sampleRate*4),buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){
    const w=Math.random()*2-1;
    if(kind==='waves'){last=(last+.02*w)/1.02;d[i]=Math.max(-1,Math.min(1,last*3.2))}
    else d[i]=w;
  }
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const filt=ac.createBiquadFilter(),gain=ac.createGain();
  if(kind==='rain'){filt.type='lowpass';filt.frequency.value=2600}
  else if(kind==='waves'){filt.type='lowpass';filt.frequency.value=700}
  else{filt.type='bandpass';filt.frequency.value=1400;filt.Q.value=.7}
  src.connect(filt);filt.connect(gain);gain.connect(ac.destination);
  gain.gain.value=0;gain.gain.linearRampToValueAtTime(sVol*.5,ac.currentTime+1.2);
  src.start();

  }

}
